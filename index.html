<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--seo-->
<noscript><style>#boot,#panel,#desk,#dock{display:none!important}body{overflow:auto!important}</style></noscript>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
</head>
<body>
<a class="skip-link" href="/resume">Skip to the plain resume</a>
<!--noscript-->
<div id="boot" aria-hidden="true"><span class="skip">click or press Esc to skip</span></div>
<canvas id="matrix" aria-hidden="true"></canvas>

<header id="panel">
  <button class="pbtn brandbtn" id="brand" type="button" aria-label="Open app launcher" aria-haspopup="dialog" aria-expanded="false"><b aria-hidden="true">●</b> shreshtha-os</button>
  <div class="ws" id="ws" role="group" aria-label="Workspaces"></div>
  <div class="ptitle" id="ptitle"></div>
  <div class="tray">
    <a class="pbtn plain" href="/resume" title="A plain, printable resume (no JavaScript)">Plain view</a>
    <a class="pbtn hide-s" href="" id="ghlink" target="_blank" rel="noopener"></a>
    <span class="hide-s" aria-hidden="true">cpu <canvas id="cpu" width="60" height="16"></canvas></span>
    <span class="hide-s" aria-hidden="true">net <b>▲▼</b></span>
    <span class="hide-s" aria-hidden="true">bat <b>100%</b></span>
    <b id="clock"></b>
  </div>
</header>

<main id="desk" aria-label="Desktop">
  <canvas id="rain" aria-hidden="true"></canvas>
  <pre class="logo" id="logo" aria-hidden="true"></pre>
  <div class="logo-cap"><b>Shreshtha OS 26.11</b><br><span id="capline"></span><br><span id="capgh"></span><br>right-click the desktop · Ctrl+Alt+T for a terminal</div>
  <nav class="icons" id="icons" aria-label="Desktop shortcuts"></nav>
</main>
<nav id="dock" aria-label="Dock"></nav>

<div id="launch" hidden role="dialog" aria-modal="true" aria-label="App launcher"><div class="lwrap"><input id="lq" placeholder="Search apps and files…" aria-label="Search apps and files"><div class="apps" id="apps"></div></div></div>
<div id="switcher" hidden role="dialog" aria-modal="true" aria-labelledby="sw-h"><div class="sw-panel"><div class="sw-head"><h2 id="sw-h">Recent apps</h2><button class="sw-all" type="button">Close all</button><button class="sw-done" type="button">Done</button></div><div class="sw-list"></div></div></div>
<div id="ctx" hidden role="menu"></div>
<div id="toasts" aria-live="polite"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
