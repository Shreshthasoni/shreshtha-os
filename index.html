<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shreshtha OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
<style>
/* Layout idea: a Linux desktop. GRUB, kernel log and login lead into a tiling-flavoured
   window manager: top panel with workspaces and tray, dock at the bottom, overlapping windows.
   Every piece of the portfolio is a file, a command or an app. */
:root{
  --acc:#3dff8f; --acc-dim:color-mix(in srgb,var(--acc) 22%,transparent);
  --bg:#07090a; --wall:#0b0f10; --panel:#0d1214; --win:#0f1517; --win-2:#141c1f; --line:#1f2a2e; --fg:#cfd8d3; --muted:#7c8a86;
  --red:#ff5f6d; --yellow:#ffd166; --blue:#5cc8ff; --magenta:#ff7ad9; --orange:#ff9f43;
  --f:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:13.5px;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--acc)} button{font-family:inherit} ::selection{background:var(--acc);color:#000}
:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
.scan::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;z-index:500;background:#000;color:#bbb;display:flex;flex-direction:column}
#boot .skip{position:absolute;right:16px;bottom:14px;color:#666;font-size:12px}
.grub{margin:auto;width:min(640px,92vw);border:1px solid #888;padding:2px}
.grub h1{margin:0;padding:8px 12px;text-align:center;font-size:13px;font-weight:400;color:#ddd}
.grub ul{list-style:none;margin:0;padding:8px 0;border-top:1px solid #888;min-height:150px}
.grub li{padding:2px 12px}
.grub li.sel{background:#ddd;color:#000}
.grub p{margin:0;padding:8px 12px;border-top:1px solid #888;font-size:12px;color:#999}
.klog{padding:14px 18px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;overflow:hidden}
.ok{color:var(--acc)} .dim{color:#666}
.login{margin:auto;text-align:center;display:grid;gap:14px;justify-items:center}
.login .clock{font-size:clamp(54px,10vw,96px);font-weight:800;letter-spacing:-.04em;color:#e8efe9}
.login .date{color:var(--muted);margin-top:-10px}
.avatar{width:84px;height:84px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;font-weight:800;font-size:28px;color:var(--acc);background:var(--acc-dim)}
.pw{width:260px;border:1px solid var(--line);background:#0c1113;padding:10px 12px;text-align:left;color:var(--fg);min-height:40px}
.pw .cur{display:inline-block;width:8px;height:16px;background:var(--acc);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- desktop ---------- */
#desk{position:fixed;inset:30px 0 0 0;background:radial-gradient(900px 600px at 75% 40%, color-mix(in srgb,var(--acc) 7%,transparent), transparent 65%),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/32px 32px,var(--wall)}
#rain{position:absolute;inset:0;width:100%;height:100%;opacity:.0;transition:opacity .6s;pointer-events:none}
.w-matrix #rain{opacity:.35}
.w-plain #desk{background:var(--wall)}
.logo{position:absolute;right:4%;top:50%;transform:translateY(-55%);margin:0;color:color-mix(in srgb,var(--acc) 55%,#000);font-size:clamp(5px,.78vw,11px);line-height:1.05;pointer-events:none;user-select:none;text-align:left}
.logo-cap{position:absolute;right:4%;bottom:90px;text-align:right;color:var(--muted);font-size:12px;line-height:1.7;pointer-events:none}
.logo-cap b{color:var(--fg)}
.icons{position:absolute;left:12px;top:12px;display:grid;gap:4px;z-index:1}
.dicon{width:92px;padding:8px 4px 6px;border:1px solid transparent;background:none;color:var(--fg);text-align:center;cursor:pointer;font-size:11.5px;display:grid;justify-items:center;gap:6px;border-radius:4px}
.dicon:hover,.dicon:focus-visible{background:rgba(255,255,255,.05);border-color:var(--line)}
.dicon svg{width:34px;height:34px}

/* top panel */
#panel{position:fixed;top:0;left:0;right:0;height:30px;z-index:300;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 8px;font-size:12px;user-select:none}
.pbtn{background:none;border:0;color:var(--fg);padding:4px 8px;cursor:pointer;border-radius:3px;font-size:12px;display:flex;align-items:center;gap:6px}
.pbtn:hover{background:rgba(255,255,255,.06)}
.brandbtn b{color:var(--acc)}
.ws{display:flex;gap:3px}
.ws button{width:24px;height:20px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;font-size:11px;border-radius:2px;position:relative}
.ws button.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
.ws button.has::after{content:"";position:absolute;bottom:1px;left:50%;width:3px;height:3px;margin-left:-1.5px;background:currentColor;border-radius:50%}
.ptitle{flex:1;text-align:center;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ptitle b{color:var(--fg);font-weight:500}
.tray{display:flex;align-items:center;gap:12px;color:var(--muted)}
.tray b{color:var(--fg);font-weight:500}
#cpu{width:60px;height:16px;display:block}

/* dock */
#dock{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:290;display:flex;gap:6px;padding:6px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px);max-width:calc(100vw - 16px);overflow-x:auto}
.dk{position:relative;width:42px;height:42px;border:0;border-radius:8px;background:var(--win-2);color:var(--fg);cursor:pointer;display:grid;place-items:center;flex:none}
.dk:hover{background:var(--acc-dim);color:var(--acc)}
.dk svg{width:22px;height:22px}
.dk.run::after{content:"";position:absolute;bottom:2px;left:50%;width:14px;height:2px;margin-left:-7px;background:var(--acc);border-radius:2px}
.dk .tip{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:3px 7px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.dk:hover .tip,.dk:focus-visible .tip{opacity:1}

/* windows */
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.55);min-width:280px;min-height:160px;border-radius:6px;overflow:hidden;animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.win.focus{border-color:color-mix(in srgb,var(--acc) 60%,var(--line));box-shadow:0 22px 60px rgba(0,0,0,.65),0 0 0 1px color-mix(in srgb,var(--acc) 20%,transparent)}
.win.max{border-radius:0}
.win.hide{display:none}
.tbar{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;background:var(--win-2);border-bottom:1px solid var(--line);cursor:default;user-select:none;touch-action:none}
.tbar svg{width:14px;height:14px;color:var(--acc);flex:none}
.tbar b{flex:1;font-weight:500;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted)}
.win.focus .tbar b{color:var(--fg)}
.wb{display:flex;gap:2px}
.wb button{width:26px;height:22px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:3px;font-size:13px;line-height:1}
.wb button:hover{background:rgba(255,255,255,.08);color:var(--fg)}
.wb button.x:hover{background:var(--red);color:#000}
.wbody{flex:1;min-height:0;overflow:auto;position:relative}
.grip{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,var(--line) 50% 60%,transparent 60% 70%,var(--line) 70% 80%,transparent 80%)}

/* terminal */
.term{background:#050807;color:#cfe3d6;font-size:13.5px;line-height:1.5;padding:10px 12px;min-height:100%;cursor:text}
.term pre{margin:0;font:inherit;white-space:pre-wrap;word-break:break-word}
.tline{display:flex;gap:8px;align-items:baseline}
.tline input{flex:1;min-width:40px;background:transparent;border:0;outline:0;color:#fff;font:inherit;caret-color:var(--acc);padding:0}
.c-acc{color:var(--acc)} .c-b{color:var(--blue)} .c-y{color:var(--yellow)} .c-r{color:var(--red)} .c-m{color:var(--magenta)} .c-o{color:var(--orange)} .c-d{color:var(--muted)} .c-w{color:#fff;font-weight:700}
.bar{display:inline-block;height:10px;background:var(--acc);vertical-align:0}

/* files */
.fm{display:grid;grid-template-columns:170px 1fr;height:100%}
.fm nav{border-right:1px solid var(--line);padding:8px;display:grid;align-content:start;gap:2px;background:var(--win-2)}
.fm nav button{text-align:left;background:none;border:0;color:var(--muted);padding:6px 8px;cursor:pointer;border-radius:3px;font-size:12.5px}
.fm nav button.on,.fm nav button:hover{background:var(--acc-dim);color:var(--fg)}
.fm .main{display:flex;flex-direction:column;min-width:0}
.crumb{padding:8px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
.crumb b{color:var(--acc);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;padding:12px}
.fi{border:1px solid transparent;background:none;color:var(--fg);padding:10px 4px 8px;border-radius:4px;cursor:pointer;display:grid;justify-items:center;gap:6px;font-size:11.5px;word-break:break-all}
.fi:hover,.fi:focus-visible{background:rgba(255,255,255,.04);border-color:var(--line)}
.fi svg{width:36px;height:36px}

/* editor */
.ed{display:flex;flex-direction:column;height:100%;background:#0a0f10}
.ed .code{flex:1;overflow:auto;display:grid;grid-template-columns:auto 1fr;font-size:13px;line-height:1.6}
.ed .ln{padding:8px 10px 8px 12px;text-align:right;color:#3d4b47;user-select:none;border-right:1px solid var(--line);white-space:pre}
.ed .tx{padding:8px 14px;white-space:pre-wrap;word-break:break-word;margin:0;font:inherit}
.ed .status{display:flex;justify-content:space-between;gap:8px;background:var(--acc);color:#000;font-size:11.5px;font-weight:700;padding:3px 10px}
.ed .status span:last-child{font-weight:400}
.h1{color:var(--acc);font-weight:700} .h2{color:var(--blue);font-weight:700} .li{color:var(--yellow)} .kw{color:var(--magenta)} .str{color:var(--orange)} .cm{color:var(--muted);font-style:italic}

/* monitor */
.mon{padding:10px 12px;font-size:12.5px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-bottom:10px}
.meter{display:grid;grid-template-columns:40px 1fr 52px;gap:8px;align-items:center}
.meter .track{height:10px;border:1px solid var(--line);position:relative}
.meter .fill{position:absolute;inset:0 auto 0 0;background:var(--acc);transition:width .6s}
.mon table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.mon th{text-align:left;background:var(--acc);color:#000;font-weight:700;padding:3px 6px}
.mon td{padding:3px 6px;border-bottom:1px solid #121a1c;white-space:nowrap}
.mon tr:hover td{background:var(--acc-dim)}
.mon .foot{margin-top:8px;color:var(--muted)}
.mon .foot b{color:#000;background:var(--fg);padding:0 4px;margin-right:4px}

/* doc-like apps */
.doc{padding:18px 22px;font-size:14px;line-height:1.65;font-family:var(--f)}
.doc h2{margin:0 0 4px;font-size:20px;color:var(--acc)}
.doc .sub{color:var(--muted);margin:0 0 14px}
.doc p{margin:0 0 10px}
.it{padding-bottom:12px;margin-bottom:12px;border-bottom:1px dashed var(--line)} .it:last-child{border:0;margin:0;padding:0}
.ih{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline} .ih h4{margin:0;font-size:14.5px;color:#fff}
.when{font-size:12px;color:var(--muted)} .org{margin:2px 0 6px;color:var(--muted);font-size:13px}
.doc ul{margin:0;padding-left:18px} .doc li{margin-bottom:4px}
.pill{font-size:10.5px;color:var(--acc);border:1px solid var(--acc);padding:0 5px;margin-left:6px;vertical-align:1px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px} .chips span{font-size:11.5px;border:1px solid var(--line);padding:2px 7px;color:var(--fg)}
.kit{display:grid;grid-template-columns:140px 1fr;gap:6px 12px} .kit dt{color:var(--yellow);padding-top:3px} .kit dd{margin:0}
.lines{display:grid;gap:4px}
.act,.btn{display:inline-block;font-size:12.5px;border:1px solid var(--acc);color:var(--acc);background:transparent;padding:7px 12px;text-decoration:none;cursor:pointer;margin:6px 8px 0 0;border-radius:3px}
.btn.solid{background:var(--acc);color:#000;font-weight:700}
.form{display:grid;gap:10px;margin-top:6px}
.form label{display:grid;gap:4px;color:var(--muted);font-size:12px}
.form input,.form textarea{background:#080c0d;border:1px solid var(--line);color:var(--fg);font:inherit;padding:8px 10px;border-radius:3px}
.form textarea{min-height:110px;resize:vertical}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
.seg button{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}

/* github */
.gh{display:grid;grid-template-columns:240px 1fr;gap:22px;padding:20px 22px;font-size:13.5px;line-height:1.6}
.gh-side .av{width:150px;height:150px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:48px;font-weight:800;color:var(--acc);background:radial-gradient(circle at 30% 30%,var(--acc-dim),transparent 70%),#0a0f10}
.gh-side h2{margin:12px 0 0;font-size:20px;color:#fff}
.gh-side .handle{color:var(--muted);font-size:15px}
.gh-side p{margin:10px 0}
.gh-side .meta{display:grid;gap:4px;color:var(--muted);font-size:12.5px;margin-top:10px}
.gh-side .meta b{color:var(--fg);font-weight:500}
.gh-readme{border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:16px}
.gh-readme .fn{color:var(--muted);font-size:11.5px;margin-bottom:8px}
.gh-readme h3{margin:0 0 6px;color:#fff;font-size:17px}
.gh-readme p{margin:0 0 8px}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pin{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.pin b{color:var(--blue);font-weight:600}
.pin .d{color:var(--muted);font-size:12.5px}
.pin .lang{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.pin .lang i{width:10px;height:10px;border-radius:50%;display:inline-block}
.gh-h{font-size:13px;color:var(--muted);margin:0 0 8px}
@media (max-width:760px){.gh{grid-template-columns:1fr}.gh-side .av{width:96px;height:96px;font-size:32px}}

/* launcher, menu, toast */
#launch{position:fixed;inset:30px 0 0 0;z-index:400;background:rgba(3,5,6,.82);backdrop-filter:blur(6px);display:grid;place-items:start center;padding-top:8vh}
#launch[hidden]{display:none}
#launch input{width:min(520px,90vw);background:#0a0f10;border:1px solid var(--acc);color:#fff;font:inherit;font-size:16px;padding:12px 14px;border-radius:6px;outline:none}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:min(640px,92vw);margin-top:22px}
.apps button{background:var(--win-2);border:1px solid var(--line);color:var(--fg);padding:14px 6px;border-radius:8px;cursor:pointer;display:grid;justify-items:center;gap:8px;font-size:12px}
.apps button:hover,.apps button:focus-visible{border-color:var(--acc);color:var(--acc)}
.apps svg{width:28px;height:28px}
#ctx{position:fixed;z-index:450;background:var(--panel);border:1px solid var(--line);min-width:210px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.5);border-radius:4px}
#ctx[hidden]{display:none}
#ctx button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:7px 10px;cursor:pointer;font-size:12.5px;border-radius:3px}
#ctx button:hover{background:var(--acc);color:#000}
#ctx button span{color:var(--muted)} #ctx button:hover span{color:#000}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#toasts{position:fixed;right:12px;top:42px;z-index:350;display:grid;gap:8px;width:min(330px,calc(100vw - 24px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);padding:10px 12px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .25s ease-out}
.toast b{display:block;color:#fff;margin-bottom:2px}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
#matrix{position:fixed;inset:0;z-index:600;background:#000;display:none}
#matrix.on{display:block}

@media (max-width:760px){
  .ptitle,.tray .hide-s{display:none}
  .logo{right:50%;transform:translate(50%,-80%);font-size:4.2px}
  .logo-cap{right:16px;left:16px;text-align:center;bottom:84px}
  .icons{grid-template-columns:repeat(4,1fr);right:12px}
  .dicon{width:auto}
  .win{left:0!important;top:0!important;width:100%!important;height:calc(100% - 66px)!important;border-radius:0}
  .grip{display:none}
  .fm{grid-template-columns:1fr}.fm nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .kit{grid-template-columns:1fr;gap:2px}.kit dd{margin-bottom:8px}
  .meters{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="boot" aria-hidden="true"><span class="skip">click or press Esc to skip</span></div>
<canvas id="matrix" aria-hidden="true"></canvas>

<header id="panel">
  <button class="pbtn brandbtn" id="brand" type="button" aria-label="Open app launcher"><b>●</b> shreshtha-os</button>
  <div class="ws" id="ws" aria-label="Workspaces"></div>
  <div class="ptitle" id="ptitle"></div>
  <div class="tray">
    <a class="pbtn hide-s" href="" id="ghlink" target="_blank" rel="noopener" style="text-decoration:none"></a>
    <span class="hide-s">cpu <canvas id="cpu" width="60" height="16"></canvas></span>
    <span class="hide-s">net <b>▲▼</b></span>
    <span class="hide-s">bat <b>100%</b></span>
    <b id="clock"></b>
  </div>
</header>

<main id="desk" aria-label="Desktop">
  <canvas id="rain"></canvas>
  <pre class="logo" id="logo" aria-hidden="true"></pre>
  <div class="logo-cap"><b>Shreshtha OS 26.11</b><br>Shreshtha Soni · full-stack developer · Jaipur<br><span id="capgh"></span><br>right-click the desktop · Ctrl+Alt+T for a terminal</div>
  <nav class="icons" id="icons" aria-label="Desktop shortcuts"></nav>
</main>
<nav id="dock" aria-label="Dock"></nav>

<div id="launch" hidden><div style="display:grid;justify-items:center"><input id="lq" placeholder="Search apps and files…" aria-label="Search apps"><div class="apps" id="apps"></div></div></div>
<div id="ctx" hidden role="menu"></div>
<div id="toasts" aria-live="polite"></div>

<script>
const CV = {
  name: "Shreshtha Soni",
  nick: "Keshav",
  title: "Full-stack developer",
  line: "B.Tech CSE student at JECRC University, Jaipur. I build products and ship them to real users.",
  about: [
    "I'm Shreshtha Soni, Keshav to most people. I'm a B.Tech Computer Science student at JECRC University, Jaipur (2024 to 2028), and I like taking products all the way from idea to real users.",
    "I've shipped an Android app to the Google Play Store, a school management ERP that schools use every day, and live websites for paying clients. I also did a paid, on-site full-stack internship at Tagshop.ai, an AI video startup.",
    "I started in graphic design and video editing, so I care how a product looks as much as how it runs. Right now I'm sharpening my DSA and going deeper into machine learning. Away from the keyboard, I play classical flute."
  ],
  work: [
    {role: "Full-Stack Developer Intern", org: "Tagshop.ai · AI UGC video platform · Paid, on-site", when: "Jun 2026 – Oct 2026", short: "Tagshop.ai",
     bullets: ["Worked across the frontend and backend of a production AI video platform, shipping features and fixes used by live customers.",
               "Mapped the platform's system architecture from its routing layer and wrote the engineering onboarding document with diagrams.",
               "Debugged and fixed image-quality (blur) issues in the media rendering pipeline.",

/* ---------------- matrix rain ---------------- */
function rain(canvas, alpha = .08) {
  const g = canvas.getContext("2d"); let cols, drops, raf = 0, last = 0;
  const size = () => { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; cols = Math.ceil(canvas.width / 14); drops = Array.from({length: cols}, () => Math.random() * -50); };
  size(); addEventListener("resize", size);
  const chars = "アカサタナハマヤラワ0123456789SHRESHTHA<>/{}=+*";
  const frame = t => { raf = requestAnimationFrame(frame); if (t - last < 50) return; last = t;
    g.fillStyle = `rgba(0,0,0,${alpha})`; g.fillRect(0, 0, canvas.width, canvas.height);
    g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--acc"); g.font = "14px JetBrains Mono, monospace";
    drops.forEach((y, i) => { g.fillText(chars[Math.floor(Math.random() * chars.length)], i * 14, y * 14); drops[i] = y * 14 > canvas.height && Math.random() > .975 ? 0 : y + 1; }); };
  return {start() { if (!raf && !reduce) raf = requestAnimationFrame(frame); }, stop() { cancelAnimationFrame(raf); raf = 0; }};
}
const wallRain = rain($("#rain"), .12);
const mx = $("#matrix"), mxRain = rain(mx, .06);
function runMatrix() {
  if (reduce) { toast("Matrix", "Animation is off because your system prefers reduced motion."); return; }
  mx.classList.add("on"); mxRain.start();
  const stop = () => { mx.classList.remove("on"); mxRain.stop(); removeEventListener("keydown", stop); mx.removeEventListener("click", stop); };
  setTimeout(() => { addEventListener("keydown", stop, {once: true}); mx.addEventListener("click", stop, {once: true}); }, 300);
  setTimeout(stop, 9000);
}
